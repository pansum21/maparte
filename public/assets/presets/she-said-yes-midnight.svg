<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 980" width="100%" height="100%">
  <defs>
    <style>
      .paper { fill: #0d1829; }
      .outer-border { fill: none; stroke: #dfba73; stroke-width: 3.5; }
      .inner-border { fill: none; stroke: #dfba73; stroke-width: 1.2; }
      .neatline-div { stroke: #dfba73; stroke-width: 1.2; }
      .map-bg { fill: #0f1f33; }
      .water-body { fill: #15253b; }
      .road-grid { stroke: #22354e; stroke-width: 0.9; }
      .road-diag { stroke: #22354e; stroke-width: 1.1; stroke-dasharray: 4 3; }
      .road-secondary { stroke: #364d6c; stroke-width: 1.8; fill: none; }
      .road-primary { stroke: #e2c58a; stroke-width: 3.2; fill: none; }
      .marathon-route { stroke: #f59e0b; stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-dasharray: 8 4; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
      .title-text { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 700; letter-spacing: 0.18em; fill: #f9fafb; text-anchor: middle; }
      .sub-text { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: 0.28em; fill: #c5b084; text-anchor: middle; text-transform: uppercase; }
      .headline-text { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 14.5px; font-weight: 700; letter-spacing: 0.16em; fill: #f9fafb; text-anchor: middle; text-transform: uppercase; }
      .date-text { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.22em; fill: #c5b084; text-anchor: middle; }
    </style>
    <!-- Clip path for map window -->
    <clipPath id="mapClip">
