05" y2="399.95" class="road-grid" /><line x1="44.95" y1="444.95" x2="655.05" y2="444.95" class="road-grid" /><line x1="44.95" y1="489.95" x2="655.05" y2="489.95" class="road-grid" /><line x1="44.95" y1="534.95" x2="655.05" y2="534.95" class="road-grid" /><line x1="44.95" y1="579.95" x2="655.05" y2="579.95" class="road-grid" /><line x1="44.95" y1="624.95" x2="655.05" y2="624.95" class="road-grid" /><line x1="44.95" y1="144.95" x2="655.05" y2="584.95" class="road-diag" /><line x1="44.95" y1="564.95" x2="655.05" y2="124.95" class="road-diag" />
    
      <g transform="translate(346.20199999999994, 301.75)">
