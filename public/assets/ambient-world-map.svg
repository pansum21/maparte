  <!-- Equator & Coordinates Axis -->
  <g stroke="rgba(223, 186, 115, 0.28)" stroke-width="1.5">
    <line x1="0" y1="540" x2="1920" y2="540" />
    <line x1="960" y1="0" x2="960" y2="1080" stroke-dasharray="6,6" />
    <line x1="0" y1="270" x2="1920" y2="270" stroke-dasharray="2,6" stroke="rgba(223, 186, 115, 0.15)" />
