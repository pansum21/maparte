<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <!-- Deep Cartographic Graticules -->
  <g stroke="rgba(164, 195, 219, 0.15)" stroke-width="1" stroke-dasharray="4,8">
