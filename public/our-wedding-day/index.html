        z-index: 0;

        width: 110vw;
        height: 110vh;
        background-size: cover;
        background-position: center 35%;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s ease;
        will-change: opacity, transform;

      .ghost-map-layer.is-active {
        transform: scale(1);

      /* Carrara Ghost Map: Soft transparent grey marble roads on off-white */
      .ghost-map-carrara {
        background-image: url('/assets/where-we-met-paris-carrara.png');

      }
      .quote {
        font-style: italic;
        color: #334155;
        font-size: 0.95rem;
        line-height: 1.65;
        margin-bottom: 16px;
      }
      .author {
        font-size: 0.85rem;
        color: #64748b;
        font-weight: 600;
      }

      /* FAQ */
      .faq-list {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .faq-item {
        background: var(--bg-card);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
      }
      .faq-question {
        font-weight: 700;
        font-size: 1.05rem;
        color: #0f172a;
        margin-bottom: 8px;
      }
      .faq-answer {
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      /* Final CTA */
      .final-cta {
        text-align: center;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.94) 0%, rgba(255, 241, 242, 0.92) 50%, rgba(254, 243, 199, 0.92) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid #fecdd3;
        border-radius: 24px;
        padding: 64px 28px;
        margin-bottom: 80px;
        box-shadow: 0 20px 50px rgba(225, 29, 72, 0.08);
      }
      .final-cta h2 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2.1rem, 4vw, 2.9rem);
        color: #0f172a;
        margin-bottom: 14px;
      }
      .final-cta p {
        font-size: 1.1rem;
        color: #475569;
        max-width: 620px;
        margin: 0 auto 32px;
      }

      /* Footer */
      footer {
        border-top: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(241, 237, 230, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 40px 24px;
        text-align: center;
        font-size: 0.85rem;
        color: #64748b;
        position: relative;
        z-index: 1;
      }
      footer a {
        color: #64748b;
        margin: 0 12px;
      }
      footer a:hover {
        color: #0f172a;
      }

      /* Keyframes */
      @keyframes heartPulse {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.22); }
        30% { transform: scale(1); }
        45% { transform: scale(1.18); }
        60% { transform: scale(1); }
      }
      .heart-pulse {
        display: inline-block;
        animation: heartPulse 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      .btn-romantic::after {
        content: '';
        position: absolute;
        top: 0;
        left: -120%;
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        transform: skewX(-22deg);
        animation: shimmerSweep 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes shimmerSweep {
        0%, 65% { left: -120%; }
        100% { left: 160%; }
      }

      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(32px);
        transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .cards-grid .card:nth-child(1) { transition-delay: 0.05s; }
      .cards-grid .card:nth-child(2) { transition-delay: 0.15s; }
      .cards-grid .card:nth-child(3) { transition-delay: 0.25s; }
      .cards-grid .card:nth-child(4) { transition-delay: 0.35s; }

      .steps-grid .step-item:nth-child(1) { transition-delay: 0.05s; }
      .steps-grid .step-item:nth-child(2) { transition-delay: 0.18s; }
      .steps-grid .step-item:nth-child(3) { transition-delay: 0.30s; }

      .testimonials-grid .testimonial-card:nth-child(1) { transition-delay: 0.05s; }
      .testimonials-grid .testimonial-card:nth-child(2) { transition-delay: 0.18s; }
      .testimonials-grid .testimonial-card:nth-child(3) { transition-delay: 0.30s; }

      .switcher-btn:active {
        transform: scale(0.94);
      }

      @media (max-width: 768px) {
        .hero { padding: 44px 16px 36px; }
        .mockup-controls-cluster { gap: 10px; }
        .control-group { padding: 4px 5px 4px 10px; }
        .switcher-btn { padding: 6px 12px; font-size: 0.8rem; }
        .nav-cta { padding: 8px 16px; font-size: 0.82rem; }
      }
    </style>
  </head>
  <body>
    <!-- Full-Window Translucent Map Backdrop (Fixed across entire scroll height) -->
    <div class="ghost-map-backdrop-wrapper" aria-hidden="true">
      <div class="ghost-map-layer ghost-map-carrara is-active" id="ghostMapCarrara"></div>
      <div class="ghost-map-layer ghost-map-midnight" id="ghostMapMidnight"></div>
    </div>

    <!-- Top Navigation -->
    <header>
      <div class="nav-container">
        <a href="/" class="brand">
          <img src="/assets/logo.svg" alt="MAPARTE Logo" />
          <div>
            <div class="brand-title">MAPARTE</div>
            <div class="brand-sub">Mapping your visuals</div>
          </div>
        </a>
        <nav style="display: flex; align-items: center; gap: 20px;">
          <a href="/#popular-cities" style="color: var(--text-secondary); font-size: 0.9rem;">800 Cities</a>
          <a href="/#framing-guide" style="color: var(--text-secondary); font-size: 0.9rem;">Framing Guide</a>
          <a href="/cities/paris-map-poster?city=Paris&lat=48.85341&lon=2.3488&title=OUR%20WEDDING%20DAY&headline=FOREVER%20BEGAN%20HERE%20%E2%80%A2%20VOWS&theme=' + config.themeQuery + '&font=Playfair+Display&shape=heart&shapeFinish=shadow&border=neatline-thick-thin';

          ctaBtns.forEach(function(btn) {
            btn.href = targetUrl;
          });

          img.style.opacity = '1';
          img.style.transform = 'scale(1)';
        }, 120);
      }

      function setTheme(theme) {
        if (currentTheme === theme) return;
        currentTheme = theme;
        var btnC = document.getElementById('btnThemeCarrara');
        var btnM = document.getElementById('btnThemeMidnight');
        if (btnC) btnC.classList.toggle('is-active', theme === 'carrara');
        if (btnM) btnM.classList.toggle('is-active', theme === 'midnight');
        updatePosterDisplay();
      }

      function setCity(city) {
        if (currentCity === city) return;
        currentCity = city;
        var btnP = document.getElementById('btnCityParis');
        var btnNy = document.getElementById('btnCityNy');
        if (btnP) btnP.classList.toggle('is-active', city === 'paris');
        if (btnNy) btnNy.classList.toggle('is-active', city === 'newyork');
        updatePosterDisplay();
      }

      // Initialize on DOM Ready
      document.addEventListener('DOMContentLoaded', function() {
        // 3D Perspective Tilt on Mouse Movement
        var frame = document.getElementById('mockupFrame');
        var frameWrap = document.getElementById('mockupFrameWrap');
        var glare = document.getElementById('mockupGlare');

        if (frame && frameWrap) {
          frameWrap.addEventListener('mouseenter', function() {
            frame.classList.remove('is-floating');
          });

          frameWrap.addEventListener('mousemove', function(e) {
            var rect = frame.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;

            var rotateX = ((y - centerY) / centerY) * -10;
            var rotateY = ((x - centerX) / centerX) * 10;

            frame.style.transform = 'perspective(1200px) rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg) scale3d(1.02, 1.02, 1.02)';
            if (glare) {
              glare.style.setProperty('--mouse-x', ((x / rect.width) * 100).toFixed(1) + '%');
              glare.style.setProperty('--mouse-y', ((y / rect.height) * 100).toFixed(1) + '%');
            }
          });

          frameWrap.addEventListener('mouseleave', function() {
            frame.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            setTimeout(function() {
              frame.classList.add('is-floating');
            }, 300);
          });
        }

        // Intersection Observer for Silky Scroll Reveals
        if ('IntersectionObserver' in window) {
          var revealObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                revealObserver.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

          document.querySelectorAll('.reveal-on-scroll').forEach(function(el) {
            revealObserver.observe(el);
          });
        } else {
          document.querySelectorAll('.reveal-on-scroll').forEach(function(el) {
            el.classList.add('is-visible');
          });
        }

        // Initial poster display sync
        updatePosterDisplay();
      });
    </script>
  </body>
</html>
